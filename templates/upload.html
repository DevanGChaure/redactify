{% extends "base.html" %}
{% block content %}
<h2>Upload Document</h2>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="POST" enctype="multipart/form-data">
    <input type="file" name="document" accept=".pdf,.png,.jpg,.jpeg">
    <button type="submit">Upload</button>
</form>
{% endblock %}
